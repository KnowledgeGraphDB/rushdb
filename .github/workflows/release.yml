name: Release and Deploy

# Nothing ships when a feature/fix branch lands on main. Shipping is triggered by
# merging the changesets "version packages" PR, which is the only commit that
# changes package.json versions — see .github/scripts/detect-version-bumps.mjs.
#
# Each artifact is versioned and shipped on its own:
#   rushdb/platform    ← rushdb-core's version, rebuilt when core or dashboard bumps
#   rushdb/mcp-server  ← @rushdb/mcp-server's version, rebuilt when it bumps
#   npm packages       ← published by changesets when a public package bumps
#
# So a core-only patch redeploys the platform without touching npm, and an
# sdk-only patch flows into both images via the dependent bumps changesets makes
# (updateInternalDependencies: patch). Minor releases land on one shared version
# for everything they touch (`linked` in .changeset/config.json).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_platform:
        description: 'Rebuild and redeploy rushdb/platform at its current version'
        type: boolean
        default: false
      force_mcp:
        description: 'Rebuild and redeploy rushdb/mcp-server at its current version'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Releases must not overlap; a second push waits rather than cancelling a
# half-finished publish/deploy.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Deploy target is Cobalt on the VM (zero-downtime blue/green).
# Requires GitHub secrets: COBALT_URL (daemon base URL) and COBALT_API_KEY.
# Runtime env for core/mcp no longer ships with the release — it lives in
# Cobalt (`cobalt env set --project core …`).

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      platform_changed: ${{ steps.bumps.outputs.platform_changed }}
      platform_version: ${{ steps.bumps.outputs.platform_version }}
      mcp_changed: ${{ steps.bumps.outputs.mcp_image_changed }}
      mcp_version: ${{ steps.bumps.outputs.mcp_version }}
      sdk_version: ${{ steps.bumps.outputs.sdk_version }}
      any_changed: ${{ steps.bumps.outputs.any_changed }}
      published: ${{ steps.changesets.outputs.published }}
      published_packages: ${{ steps.changesets.outputs.publishedPackages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs before changesets so the working tree it may rewrite cannot affect
      # the comparison (the script reads git objects, not the tree, either way).
      - name: Detect version bumps
        id: bumps
        run: node .github/scripts/detect-version-bumps.mjs
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_PLATFORM: ${{ inputs.force_platform }}
          FORCE_MCP: ${{ inputs.force_mcp }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter ./packages/javascript-sdk... --filter ./packages/agent-memory-contract... --filter ./packages/mcp-server... build

      - name: Verify agent-memory-contract package
        run: pnpm --filter ./packages/agent-memory-contract pack:check

      - name: Setup .npmrc
        run: |
          cat << EOF > ~/.npmrc
          registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          access=public
          always-auth=true
          EOF

      # Opens/updates the "version packages" PR when changesets are pending,
      # publishes to npm when the versioned commit lands. `changeset publish`
      # covers every public workspace package (sdk, memory contract, mcp-server, skills).
      - name: Create Release PR or Publish
        id: changesets
        if: github.event_name == 'push'
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  platform-image:
    name: Platform image
    needs: release
    if: needs.release.outputs.platform_changed == 'true'
    uses: ./.github/workflows/docker-image.yml
    with:
      image: rushdb/platform
      slug: platform
      dockerfile: platform/Dockerfile
      version: ${{ needs.release.outputs.platform_version }}
      # Dashboard UI is served by core (RUSHDB_SERVE_STATIC=true); point its API
      # calls at the API origin so app.rushdb.com calls api.rushdb.com.
      build_args: |
        VITE_BACKEND_BASE_URL=https://api.rushdb.com
    secrets: inherit

  mcp-image:
    name: MCP image
    needs: release
    if: needs.release.outputs.mcp_changed == 'true'
    uses: ./.github/workflows/docker-image.yml
    with:
      image: rushdb/mcp-server
      slug: mcp-server
      dockerfile: packages/mcp-server/Dockerfile
      version: ${{ needs.release.outputs.mcp_version }}
    secrets: inherit

  deploy-core:
    name: Deploy core to Cobalt
    needs: [release, platform-image]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # GitHub is the source of truth for runtime env: sync secrets/vars to
      # Cobalt on every deploy (upsert). Values are stored encrypted in Cobalt's
      # rqlite and injected at runtime. `secrets.X || vars.X` reads either
      # classification; defaults cover the constants.
      - name: Sync runtime env to Cobalt
        env:
          COBALT_URL: ${{ secrets.COBALT_URL }}
          COBALT_API_KEY: ${{ secrets.COBALT_API_KEY }}
          NODE_ENV: ${{ secrets.NODE_ENV || vars.NODE_ENV || 'production' }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || vars.LOG_LEVEL || 'info' }}
          RUSHDB_SELF_HOSTED: ${{ secrets.RUSHDB_SELF_HOSTED || vars.RUSHDB_SELF_HOSTED || 'false' }}
          RUSHDB_SERVE_STATIC: ${{ secrets.RUSHDB_SERVE_STATIC || vars.RUSHDB_SERVE_STATIC || 'true' }}
          SQL_DB_TYPE: ${{ secrets.SQL_DB_TYPE || vars.SQL_DB_TYPE || 'postgres' }}
          SQL_DB_URL: ${{ secrets.SQL_DB_URL || vars.SQL_DB_URL }}
          NEO4J_URL: ${{ secrets.NEO4J_URL || vars.NEO4J_URL }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME || vars.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD || vars.NEO4J_PASSWORD }}
          RUSHDB_AES_256_ENCRYPTION_KEY: ${{ secrets.RUSHDB_AES_256_ENCRYPTION_KEY || vars.RUSHDB_AES_256_ENCRYPTION_KEY }}
          RUSHDB_JWT_PRIVATE_KEY_BASE64: ${{ secrets.RUSHDB_JWT_PRIVATE_KEY_BASE64 || vars.RUSHDB_JWT_PRIVATE_KEY_BASE64 }}
          RUSHDB_JWT_PUBLIC_KEY_BASE64: ${{ secrets.RUSHDB_JWT_PUBLIC_KEY_BASE64 || vars.RUSHDB_JWT_PUBLIC_KEY_BASE64 }}
          RUSHDB_JWT_KID: ${{ secrets.RUSHDB_JWT_KID || vars.RUSHDB_JWT_KID }}
          RUSHDB_DASHBOARD_URL: ${{ secrets.RUSHDB_DASHBOARD_URL || vars.RUSHDB_DASHBOARD_URL }}
          RUSHDB_PUBLIC_URL: ${{ secrets.RUSHDB_PUBLIC_URL || vars.RUSHDB_PUBLIC_URL }}
          RUSHDB_OAUTH_ISSUER: ${{ secrets.RUSHDB_OAUTH_ISSUER || vars.RUSHDB_OAUTH_ISSUER || vars.RUSHDB_PUBLIC_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET || vars.GOOGLE_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID || vars.GH_CLIENT_ID }}
          GH_SECRET: ${{ secrets.GH_SECRET || vars.GH_SECRET }}
          MAIL_HOST: ${{ secrets.MAIL_HOST || vars.MAIL_HOST }}
          MAIL_USER: ${{ secrets.MAIL_USER || vars.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD || vars.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM }}
          SERVICE_CAPTCHA_KEY: ${{ secrets.SERVICE_CAPTCHA_KEY || vars.SERVICE_CAPTCHA_KEY }}
          BILLING_SERVICE_URL: ${{ secrets.BILLING_SERVICE_URL || vars.BILLING_SERVICE_URL }}
          RUSHDB_BILLING_SECRET: ${{ secrets.RUSHDB_BILLING_SECRET || vars.RUSHDB_BILLING_SECRET }}
          RUSHDB_EMBEDDING_BASE_URL: ${{ secrets.RUSHDB_EMBEDDING_BASE_URL || vars.RUSHDB_EMBEDDING_BASE_URL }}
          RUSHDB_EMBEDDING_API_KEY: ${{ secrets.RUSHDB_EMBEDDING_API_KEY || vars.RUSHDB_EMBEDDING_API_KEY }}
          RUSHDB_EMBEDDING_MODEL: ${{ secrets.RUSHDB_EMBEDDING_MODEL || vars.RUSHDB_EMBEDDING_MODEL }}
          RUSHDB_EMBEDDING_DIMENSIONS: ${{ secrets.RUSHDB_EMBEDDING_DIMENSIONS || vars.RUSHDB_EMBEDDING_DIMENSIONS }}
          RUSHDB_LLM_BASE_URL: ${{ secrets.RUSHDB_LLM_BASE_URL || vars.RUSHDB_LLM_BASE_URL }}
          RUSHDB_LLM_API_KEY: ${{ secrets.RUSHDB_LLM_API_KEY || vars.RUSHDB_LLM_API_KEY }}
          RUSHDB_LLM_MODEL: ${{ secrets.RUSHDB_LLM_MODEL || vars.RUSHDB_LLM_MODEL }}
        run: |
          set -euo pipefail
          vars_json=$(jq -nc \
            --arg NODE_ENV "$NODE_ENV" \
            --arg LOG_LEVEL "$LOG_LEVEL" \
            --arg RUSHDB_SELF_HOSTED "$RUSHDB_SELF_HOSTED" \
            --arg RUSHDB_SERVE_STATIC "$RUSHDB_SERVE_STATIC" \
            --arg SQL_DB_TYPE "$SQL_DB_TYPE" \
            --arg SQL_DB_URL "$SQL_DB_URL" \
            --arg NEO4J_URL "$NEO4J_URL" \
            --arg NEO4J_USERNAME "$NEO4J_USERNAME" \
            --arg NEO4J_PASSWORD "$NEO4J_PASSWORD" \
            --arg RUSHDB_AES_256_ENCRYPTION_KEY "$RUSHDB_AES_256_ENCRYPTION_KEY" \
            --arg RUSHDB_JWT_PRIVATE_KEY_BASE64 "$RUSHDB_JWT_PRIVATE_KEY_BASE64" \
            --arg RUSHDB_JWT_PUBLIC_KEY_BASE64 "$RUSHDB_JWT_PUBLIC_KEY_BASE64" \
            --arg RUSHDB_JWT_KID "$RUSHDB_JWT_KID" \
            --arg RUSHDB_DASHBOARD_URL "$RUSHDB_DASHBOARD_URL" \
            --arg RUSHDB_PUBLIC_URL "$RUSHDB_PUBLIC_URL" \
            --arg RUSHDB_OAUTH_ISSUER "$RUSHDB_OAUTH_ISSUER" \
            --arg GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID" \
            --arg GOOGLE_SECRET "$GOOGLE_SECRET" \
            --arg GH_CLIENT_ID "$GH_CLIENT_ID" \
            --arg GH_SECRET "$GH_SECRET" \
            --arg MAIL_HOST "$MAIL_HOST" \
            --arg MAIL_USER "$MAIL_USER" \
            --arg MAIL_PASSWORD "$MAIL_PASSWORD" \
            --arg MAIL_FROM "$MAIL_FROM" \
            --arg SERVICE_CAPTCHA_KEY "$SERVICE_CAPTCHA_KEY" \
            --arg BILLING_SERVICE_URL "$BILLING_SERVICE_URL" \
            --arg RUSHDB_BILLING_SECRET "$RUSHDB_BILLING_SECRET" \
            --arg RUSHDB_EMBEDDING_BASE_URL "$RUSHDB_EMBEDDING_BASE_URL" \
            --arg RUSHDB_EMBEDDING_API_KEY "$RUSHDB_EMBEDDING_API_KEY" \
            --arg RUSHDB_EMBEDDING_MODEL "$RUSHDB_EMBEDDING_MODEL" \
            --arg RUSHDB_EMBEDDING_DIMENSIONS "$RUSHDB_EMBEDDING_DIMENSIONS" \
            --arg RUSHDB_LLM_BASE_URL "$RUSHDB_LLM_BASE_URL" \
            --arg RUSHDB_LLM_API_KEY "$RUSHDB_LLM_API_KEY" \
            --arg RUSHDB_LLM_MODEL "$RUSHDB_LLM_MODEL" \
            '{NODE_ENV:$NODE_ENV,LOG_LEVEL:$LOG_LEVEL,RUSHDB_SELF_HOSTED:$RUSHDB_SELF_HOSTED,RUSHDB_SERVE_STATIC:$RUSHDB_SERVE_STATIC,SQL_DB_TYPE:$SQL_DB_TYPE,SQL_DB_URL:$SQL_DB_URL,NEO4J_URL:$NEO4J_URL,NEO4J_USERNAME:$NEO4J_USERNAME,NEO4J_PASSWORD:$NEO4J_PASSWORD,RUSHDB_AES_256_ENCRYPTION_KEY:$RUSHDB_AES_256_ENCRYPTION_KEY,RUSHDB_JWT_PRIVATE_KEY_BASE64:$RUSHDB_JWT_PRIVATE_KEY_BASE64,RUSHDB_JWT_PUBLIC_KEY_BASE64:$RUSHDB_JWT_PUBLIC_KEY_BASE64,RUSHDB_JWT_KID:$RUSHDB_JWT_KID,RUSHDB_DASHBOARD_URL:$RUSHDB_DASHBOARD_URL,RUSHDB_PUBLIC_URL:$RUSHDB_PUBLIC_URL,RUSHDB_OAUTH_ISSUER:$RUSHDB_OAUTH_ISSUER,GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID,GOOGLE_SECRET:$GOOGLE_SECRET,GH_CLIENT_ID:$GH_CLIENT_ID,GH_SECRET:$GH_SECRET,MAIL_HOST:$MAIL_HOST,MAIL_USER:$MAIL_USER,MAIL_PASSWORD:$MAIL_PASSWORD,MAIL_FROM:$MAIL_FROM,SERVICE_CAPTCHA_KEY:$SERVICE_CAPTCHA_KEY,BILLING_SERVICE_URL:$BILLING_SERVICE_URL,RUSHDB_BILLING_SECRET:$RUSHDB_BILLING_SECRET,RUSHDB_EMBEDDING_BASE_URL:$RUSHDB_EMBEDDING_BASE_URL,RUSHDB_EMBEDDING_API_KEY:$RUSHDB_EMBEDDING_API_KEY,RUSHDB_EMBEDDING_MODEL:$RUSHDB_EMBEDDING_MODEL,RUSHDB_EMBEDDING_DIMENSIONS:$RUSHDB_EMBEDDING_DIMENSIONS,RUSHDB_LLM_BASE_URL:$RUSHDB_LLM_BASE_URL,RUSHDB_LLM_API_KEY:$RUSHDB_LLM_API_KEY,RUSHDB_LLM_MODEL:$RUSHDB_LLM_MODEL}')
          body=$(jq -nc --argjson vars "$vars_json" '{vars:$vars,redeploy:false}')
          curl -fsS -X POST "$COBALT_URL/api/projects/core/env" \
            -H "Authorization: Bearer $COBALT_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$body"
          echo "runtime env synced to Cobalt (core)"

      - name: Deploy core (zero-downtime blue/green)
        uses: ./.github/actions/cobalt-deploy
        with:
          cobalt-url: ${{ secrets.COBALT_URL }}
          cobalt-api-key: ${{ secrets.COBALT_API_KEY }}
          project: core
          image: ${{ needs.platform-image.outputs.image }}
          port: 3000

  deploy-mcp:
    name: Deploy MCP server to Cobalt
    needs: [release, mcp-image]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Sync runtime env to Cobalt
        env:
          COBALT_URL: ${{ secrets.COBALT_URL }}
          COBALT_API_KEY: ${{ secrets.COBALT_API_KEY }}
          MCP_TRANSPORT: ${{ secrets.MCP_TRANSPORT || vars.MCP_TRANSPORT || 'http' }}
          PORT: ${{ secrets.PORT || vars.PORT || '3001' }}
          RUSHDB_API_URL: ${{ secrets.RUSHDB_API_URL || vars.RUSHDB_API_URL || 'https://api.rushdb.com/api/v1' }}
          MCP_RESOURCE_URL: ${{ secrets.MCP_RESOURCE_URL || vars.MCP_RESOURCE_URL || 'https://mcp.rushdb.com' }}
          RUSHDB_OAUTH_ISSUER: ${{ secrets.RUSHDB_OAUTH_ISSUER || vars.RUSHDB_OAUTH_ISSUER || vars.RUSHDB_PUBLIC_URL }}
        run: |
          set -euo pipefail
          vars_json=$(jq -nc \
            --arg MCP_TRANSPORT "$MCP_TRANSPORT" \
            --arg PORT "$PORT" \
            --arg RUSHDB_API_URL "$RUSHDB_API_URL" \
            --arg MCP_RESOURCE_URL "$MCP_RESOURCE_URL" \
            --arg RUSHDB_OAUTH_ISSUER "$RUSHDB_OAUTH_ISSUER" \
            '{MCP_TRANSPORT:$MCP_TRANSPORT,PORT:$PORT,RUSHDB_API_URL:$RUSHDB_API_URL,MCP_RESOURCE_URL:$MCP_RESOURCE_URL,RUSHDB_OAUTH_ISSUER:$RUSHDB_OAUTH_ISSUER}')
          body=$(jq -nc --argjson vars "$vars_json" '{vars:$vars,redeploy:false}')
          curl -fsS -X POST "$COBALT_URL/api/projects/mcp/env" \
            -H "Authorization: Bearer $COBALT_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$body"
          echo "runtime env synced to Cobalt (mcp)"

      - name: Deploy mcp (zero-downtime blue/green)
        uses: ./.github/actions/cobalt-deploy
        with:
          cobalt-url: ${{ secrets.COBALT_URL }}
          cobalt-api-key: ${{ secrets.COBALT_API_KEY }}
          project: mcp
          image: ${{ needs.mcp-image.outputs.image }}
          port: 3001

  notify-content:
    name: Notify content control plane
    needs: [release, platform-image, mcp-image, deploy-core, deploy-mcp]
    # Fires once the release has fully landed. A skipped artifact is fine (it had
    # no version bump); a failed or cancelled one is not — and a failed image
    # build must not slip through on the strength of its deploy being skipped.
    if: |
      always() &&
      needs.release.outputs.any_changed == 'true' &&
      !contains(fromJSON('["failure", "cancelled"]'), needs.platform-image.result) &&
      !contains(fromJSON('["failure", "cancelled"]'), needs.mcp-image.result) &&
      !contains(fromJSON('["failure", "cancelled"]'), needs.deploy-core.result) &&
      !contains(fromJSON('["failure", "cancelled"]'), needs.deploy-mcp.result)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send signed release event
        env:
          CONTENT_WEBHOOK_URL: ${{ secrets.CONTENT_WEBHOOK_URL }}
          CONTENT_WEBHOOK_SECRET: ${{ secrets.CONTENT_WEBHOOK_SECRET }}
          RELEASE_VERSION: ${{ needs.release.outputs.sdk_version || needs.release.outputs.platform_version }}
          PLATFORM_VERSION: ${{ needs.release.outputs.platform_version }}
          PUBLISHED_PACKAGES: ${{ needs.release.outputs.published_packages }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/notify-content-release.mjs
